<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Captain's Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a1620;
  --bg-elev: #0f1e2b;
  --bg-elev2: #142838;
  --bg-elev3: #1a3040;
  --line: #22394a;
  --line-soft: #182b3a;
  --teal: #2dd4bf;
  --teal-dim: #1c8f81;
  --teal-deep: #0d5c53;
  --coral: #ff6b5b;
  --coral-dim: #b8453a;
  --green: #34d399;
  --amber: #f0b429;
  --ink: #e9f1f3;
  --ink2: #9db2c1;
  --ink3: #6d8494;
  --ink4: #44596a;
  --display: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overscroll-behavior: none;
  background-image:
    radial-gradient(ellipse 600px 300px at 15% 0%, rgba(45,212,191,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 500px 400px at 100% 30%, rgba(45,212,191,0.04) 0%, transparent 60%);
}

/* HEADER */
.header { background: var(--bg-elev); border-bottom: 1px solid var(--line); padding: 0 16px; position: sticky; top: 0; z-index: 100; }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; gap: 10px; }
.header-brand { display: flex; flex-direction: column; }
.header-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--teal-dim); text-transform: uppercase; margin-bottom: 2px; }
.header-title { font-family: var(--display); font-weight: 700; font-size: 21px; color: var(--ink); line-height: 1; }
.header-nav { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

.header-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent); }

/* ═══════════════════════════════════
ACTIVE VOYAGE BANNER
═══════════════════════════════════ */
.voyage-banner {
display: none;
background: var(--bg-elev);
border: 1px solid var(--teal-deep);
border-radius: 14px;
margin-bottom: 14px;
overflow: hidden;
box-shadow: 0 0 0 1px rgba(45,212,191,0.05), 0 8px 24px rgba(0,0,0,0.35);
}
.voyage-banner.active { display: block; }
.voyage-banner-top {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 14px 10px;
border-bottom: 1px solid var(--line-soft);
}
.voyage-banner-title { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.pulse-dot { width: 8px; height: 8px; background: var(--coral); border-radius: 50%; animation: pulse 1.4s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
.voyage-banner-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line-soft); }
.vstat { padding: 10px 10px; background: var(--bg-elev); text-align: center; }
.vstat-val { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--teal); line-height: 1; }
.vstat-label { font-family: var(--mono); font-size: 7px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
.voyage-banner-loc { padding: 8px 14px 10px; font-size: 12px; color: var(--ink2); }
.voyage-banner-loc span { color: var(--ink3); font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; margin-right: 6px; }
.voyage-banner-actions { display: flex; gap: 0; border-top: 1px solid var(--line-soft); }
.make-port-btn {
flex: 1;
background: transparent;
border: none;
color: var(--coral);
padding: 12px;
font-family: var(--body);
font-weight: 600;
font-size: 13px;
cursor: pointer;
-webkit-appearance: none;
}
.discard-btn {
background: transparent;
border: none;
border-left: 1px solid var(--line-soft);
color: var(--ink4);
padding: 12px 16px;
font-family: var(--body);
font-size: 12px;
cursor: pointer;
-webkit-appearance: none;
}

/* CAST OFF BUTTON */
.castoff-wrap { margin-bottom: 14px; }
.castoff-btn {
width: 100%;
background: var(--teal);
border: none;
color: #06211c;
padding: 15px;
font-family: var(--display);
font-weight: 700;
font-size: 16px;
cursor: pointer;
border-radius: 14px;
-webkit-appearance: none;
box-shadow: 0 4px 16px rgba(45,212,191,0.2);
transition: transform 0.15s, box-shadow 0.15s;
}
